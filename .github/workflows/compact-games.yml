name: Compact game messages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compact-games.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch game handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('бот.py')
          s = p.read_text(encoding='utf-8')

          # Унифицированное сообщение при запуске игры без ставки.
          # Формат: имя игрока + разделитель + правильный синтаксис команды.
          game_help = {
              'казино': '🎱 казино <b>[ставка]</b>',
              'спин': '🎰 спин <b>[ставка]</b>',
              'рулетка': '🖲 рулетка <b>[число/красное/чёрное/чётное/нечётное/1-12] [ставка]</b>',
              'кубик': '🎲 кубик <b>[число 1-6] [ставка]</b>',
              'стаканчик': '🥛 стаканчик <b>[1/2/3] [ставка]</b>',
              'орёл': '🪙 орёл/решка <b>[ставка]</b>',
              'боулинг': '🎳 боулинг/бо <b>[ставка]</b>',
              'баскетбол': '🏀 баскетбол/бс <b>[ставка]</b>',
              'дартс': '🎯 дартс/дс <b>[ставка]</b>',
              'очко': '♠️ 21/очко <b>[ставка]</b>',
          }

          def game_block(start_marker):
              start = s.find(start_marker)
              if start < 0:
                  return None
              end = s.find('\n    # ', start + len(start_marker))
              if end < 0:
                  end = len(s)
              return start, end

          def replace_first_reply_in_missing_bet(block, help_line):
              # Ищем ветку len(parts...) < N, которая сообщает пример команды.
              m = re.search(r'(        if len\(parts_g\) < \d+[^:]*:\n)(.*?)(        return\n)', block, re.S)
              if not m:
                  return block, False
              body = m.group(2)
              if 'await update.message.reply_text' not in body:
                  return block, False
              replacement = (
                  '        await update.message.reply_text(\n'
                  f'            f"🥶 {{user_link(uid, user[\'username\'])}}, ты ввел что-то неправильно!\\n"\n'
                  '            f"<code>·····················</code>\\n"\n'
                  f'            f"<u>{help_line}</u>",\n'
                  '            parse_mode=ParseMode.HTML\n'
                  '        )\n'
              )
              new_body = replacement
              return block[:m.start(2)] + new_body + block[m.end(2):], True

          targets = [
              ('    if text.startswith("казино"):', 'казино'),
              ('    if text.startswith("спин"):', 'спин'),
              ('    if text.startswith("рулетка"):', 'рулетка'),
              ('    if text.startswith("кубик"):', 'кубик'),
              ('    if text.startswith("стаканчик"):', 'стаканчик'),
              ('    if text.startswith("орёл")', 'орёл'),
              ('    if text == "боулинг" or text == "бо"', 'боулинг'),
              ('    if text == "баскетбол" or text == "бс"', 'баскетбол'),
              ('    if text == "дартс" or text == "дс"', 'дартс'),
              ('    if text == "очко" or text == "21"', 'очко'),
          ]

          for marker, name in targets:
              got = game_block(marker)
              if not got:
                  continue
              start, end = got
              block = s[start:end]
              block, changed = replace_first_reply_in_missing_bet(block, game_help[name])
              if changed:
                  s = s[:start] + block + s[end:]

          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile бот.py
          git diff --check
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add бот.py
          git diff --cached --quiet || git commit -m 'fix game command help format'
          git push
