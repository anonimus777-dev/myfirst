name: Compact games
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game messages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('бот.py')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: pattern not found')
              s = s.replace(old, new, 1)

          # 3-second cooldown for games that previously had none.
          once(
              '        bet_type = parts_g[1].lower()\n',
              '        cd = check_cooldown(uid)\n        if cd:\n            await update.message.reply_text(f"⏳ Подождите {cd} сек.")\n            return\n        bet_type = parts_g[1].lower()\n',
              'roulette cooldown')
          once(
              '        guess = int(parts_g[1])\n',
              '        cd = check_cooldown(uid)\n        if cd:\n            await update.message.reply_text(f"⏳ Подождите {cd} сек.")\n            return\n        guess = int(parts_g[1])\n',
              'cube cooldown')
          once(
              '        guess = int(parts_g[1])\n        correct = random.randint(1, 3)\n',
              '        cd = check_cooldown(uid)\n        if cd:\n            await update.message.reply_text(f"⏳ Подождите {cd} сек.")\n            return\n        guess = int(parts_g[1])\n        set_cooldown(uid)\n        correct = random.randint(1, 3)\n',
              'cups cooldown')
          once(
              '        guess = "орёл" if text.startswith("орёл") or text.startswith("орел") else "решка"\n',
              '        cd = check_cooldown(uid)\n        if cd:\n            await update.message.reply_text(f"⏳ Подождите {cd} сек.")\n            return\n        guess = "орёл" if text.startswith("орёл") or text.startswith("орел") else "решка"\n        set_cooldown(uid)\n',
              'coin cooldown')
          once(
              '        bet = parse_bet(parts_g[1], user["balance"])\n        if bet <= 0 or user["balance"] < bet:\n',
              '        cd = check_cooldown(uid)\n        if cd:\n            await update.message.reply_text(f"⏳ Подождите {cd} сек.")\n            return\n        bet = parse_bet(parts_g[1], user["balance"])\n        if bet <= 0 or user["balance"] < bet:\n',
              'spin cooldown')

          # Compact roulette result.
          old = '''        sign = "+" if change >= 0 else ""
        await update.message.reply_text(
            f"🎮 {user_link(uid, user['username'])}\\n"
            f"🎡 Шарик: {num}\\n"
            f"💸 Ставка: {fmt_smart(bet)} кр.\\n"
            f"{desc}\\n"
            f"📊 Итог: {sign}{fmt_smart(change)} кр.",
            parse_mode=ParseMode.HTML
        )'''
          new = '''        color = "🟢" if num == 0 else ("🔴" if num in red_nums else "⚫️")
        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"
        await update.message.reply_text(
            f"{user_link(uid, user['username'])}\\n"
            f"🖲 Выпало - {num} {color}\\n"
            f"{result_text}",
            parse_mode=ParseMode.HTML
        )'''
          once(old, new, 'roulette output')

          # Compact cube result.
          old = '''        sign = "+" if change >= 0 else ""
        await update.message.reply_text(
            f"🎲 {user_link(uid, user['username'])}\\n"
            f"💸 Ставка: {fmt_smart(bet)} кр. на {dice_emojis[guess]}\\n"
            f"{desc}\\n"
            f"📊 Итог: {sign}{fmt_smart(change)} кр.",
            parse_mode=ParseMode.HTML
        )'''
          new = '''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"
        await update.message.reply_text(
            f"{user_link(uid, user['username'])}\\n"
            f"🎲 Выпало - {rolled}\\n"
            f"{result_text}",
            parse_mode=ParseMode.HTML
        )'''
          once(old, new, 'cube output')

          # Compact cups result.
          old = '''        await update.message.reply_text(
            f"🥛 {user_link(uid, user['username'])}\\n"
            f"1:{cups[1]}  2:{cups[2]}  3:{cups[3]}\\n"
            f"{desc}" + (f"\\n+{fmt_smart(bonus)} кр." if bonus else ""),
            parse_mode=ParseMode.HTML
        )'''
          new = '''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(bonus)}</b> кр.!" if bonus else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"
        await update.message.reply_text(
            f"{user_link(uid, user['username'])}\\n"
            f"🥛 Выпало - {correct}\\n"
            f"{result_text}",
            parse_mode=ParseMode.HTML
        )'''
          once(old, new, 'cups output')

          # Compact coin result.
          old = '''        sign = "+" if change >= 0 else ""
        await update.message.reply_text(
            f"🪙 {user_link(uid, user['username'])}\\n"
            f"💸 Ставка: {fmt_smart(bet)} кр. на {emojis[guess]}\\n"
            f"{desc}\\n"
            f"📊 Итог: {sign}{fmt_smart(change)} кр.",
            parse_mode=ParseMode.HTML
        )'''
          new = '''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"
        await update.message.reply_text(
            f"{user_link(uid, user['username'])}\\n"
            f"🪙 Выпало - {emojis[result]}\\n"
            f"{result_text}",
            parse_mode=ParseMode.HTML
        )'''
          once(old, new, 'coin output')

          # Compact slots result.
          old = '''        sign = "+" if change >= 0 else ""
        await update.message.reply_text(
            f"🎰 {user_link(uid, user['username'])}\\n"
            f"[ {' | '.join(reel)} ]\\n"
            f"💸 Ставка: {fmt_smart(bet)} кр.\\n"
            f"{desc}\\n"
            f"📊 Итог: {sign}{fmt_smart(change)} кр.",
            parse_mode=ParseMode.HTML
        )'''
          new = '''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"
        await update.message.reply_text(
            f"{user_link(uid, user['username'])}\\n"
            f"🎰 Выпало - {' '.join(reel)}\\n"
            f"{result_text}",
            parse_mode=ParseMode.HTML
        )'''
          once(old, new, 'spin output')

          # Compact native dice results.
          patterns = [
              ('🎳', 'pins'),
              ('🏀', 'roll'),
              ('🎯', 'roll'),
          ]
          for emoji, var in patterns:
              pattern = rf'''        sign = "\\+" if change >= 0 else ""\n        await update\.message\.reply_text\(\n            f"{re.escape(emoji)} .*?\n        \)'''
              repl = f'''        result_text = f"✅ Твой выигрыш составил <b>{{fmt_smart(change)}}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(\n            f"{{user_link(uid, user['username'])}}\\n"\n            f"{emoji} Выпало - {{{var}}}\\n"\n            f"{{result_text}}",\n            parse_mode=ParseMode.HTML\n        )'''
              s2, n = re.subn(pattern, repl, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{emoji} output: pattern not found')
              s = s2

          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile бот.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add бот.py
          git diff --cached --quiet || git commit -m 'fix: compact game results and 3s cooldown'
          git push
          rm -f .github/workflows/compact-games.yml
          git add -u .github/workflows/compact-games.yml
          git diff --cached --quiet || git commit -m 'chore: remove temporary game workflow'
          git push || true
