name: Compact game messages
on:
  workflow_dispatch:
  push:
    paths:
      - 'бот.py'
jobs:
  fix:
    if: github.actor == 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch game handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('бот.py'); s=p.read_text(encoding='utf-8')

          # Ensure 3-second cooldown in all game handlers.
          for marker in ['# Кубик','# Стаканчик','# Орёл/Решка','# Боулинг','# Баскетбол','# Дартс','# Рулетка']:
              i=s.find(marker)
              if i<0: continue
              j=s.find('\n    # ', i+5)
              if j<0: j=len(s)
              block=s[i:j]
              if 'cd = check_cooldown(uid)' not in block:
                  # Insert after parts_g assignment when present, otherwise after marker.
                  pos=block.find('        parts_g = raw.split()')
                  if pos>=0:
                      e=block.find('\n',pos)
                      ins='\n        cd = check_cooldown(uid)\n        if cd:\n            await update.message.reply_text(f"⏳ Подождите {cd} сек.")\n            return'
                      block=block[:e]+ins+block[e:]
                      s=s[:i]+block+s[j:]

          # Compact cube output.
          s=re.sub(r'        sign = "\\+" if change >= 0 else ""\n        await update\.message\.reply_text\(\n            f"🎲 \{user_link\(uid, user\[\'username\'\]\)\}\\\\n"\n            f"💸 Ставка: \{fmt_smart\(bet\)\} кр\. на \{dice_emojis\[guess\]\}\\\\n"\n            f"\{desc\}\\\\n"\n            f"📊 Итог: \{sign\}\{fmt_smart\(change\)\} кр\."\,\n            parse_mode=ParseMode\.HTML\n        \)',
          '        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user[\'username\'])}\\n🎲 Выпало - {rolled}\\n{result_text}", parse_mode=ParseMode.HTML)',s,count=1)

          # Compact roulette output, preserving its color.
          s=re.sub(r'        sign = "\\+" if change >= 0 else ""\n        await update\.message\.reply_text\(\n            f"🎮 \{user_link\(uid, user\[\'username\'\]\)\}\\\\n"\n            f"🎡 Шарик: \{num\}\\\\n"\n            f"💸 Ставка: \{fmt_smart\(bet\)\} кр\.\\\\n"\n            f"\{desc\}\\\\n"\n            f"📊 Итог: \{sign\}\{fmt_smart\(change\)\} кр\."\,\n            parse_mode=ParseMode\.HTML\n        \)',
          '        color = "🟢" if num == 0 else ("🔴" if num in red_nums else "⚫️")\n        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user[\'username\'])}\\n🖲 Выпало - {num} {color}\\n{result_text}", parse_mode=ParseMode.HTML)',s,count=1)

          # Compact bowling/basketball/darts outputs by replacing their verbose reply blocks.
          patterns=[
            (r'        sign = "\\+" if change >= 0 else ""\n        await update\.message\.reply_text\(\n            f"🎳 \{user_link\(uid, user\[\'username\'\]\)\}, \{desc\}\\\\n".*?            parse_mode=ParseMode\.HTML\n        \)', '        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user[\'username\'])}\\n🎳 Выпало - {pins}\\n{result_text}", parse_mode=ParseMode.HTML)'),
            (r'        sign = "\\+" if change >= 0 else ""\n        await update\.message\.reply_text\(\n            f"🏀 \{user_link\(uid, user\[\'username\'\]\)\}, \{desc\}\\\\n".*?            parse_mode=ParseMode\.HTML\n        \)', '        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user[\'username\'])}\\n🏀 Выпало - {roll}\\n{result_text}", parse_mode=ParseMode.HTML)'),
            (r'        await update\.message\.reply_text\(\n            f"🎯 \{user_link\(uid, user\[\'username\'\]\)\}, \{desc\}\\\\n".*?            parse_mode=ParseMode\.HTML\n        \)', '        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user[\'username\'])}\\n🎯 Выпало - {roll}\\n{result_text}", parse_mode=ParseMode.HTML)')]
          for pat,repl in patterns:
              s,n=re.subn(pat,repl,s,count=1,flags=re.S)
              if n==0: print('pattern not found:',pat[:40])

          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile бот.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add бот.py
          git diff --cached --quiet || git commit -m 'fix compact game results and cooldowns'
          git push
