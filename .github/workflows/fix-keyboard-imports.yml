name: Fix keyboard imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old imports
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              new_text = text.replace('клавиатуры.общее', 'клавиатуры.общие')
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed) if changed else 'No old imports found')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: replace keyboard imports [skip ci]"
          git push