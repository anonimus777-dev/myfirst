name: Fix games
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix: apply game aliases' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game aliases
        run: python3 fix_game_aliases.py
      - name: Validate and commit
        run: |
          python3 -m py_compile бот.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add бот.py
          git rm .github/workflows/fix_games_now.yml .github/workflows/fix_game_aliases.yml fix_game_aliases.py
          git commit -m 'fix: apply game aliases'
          git push
