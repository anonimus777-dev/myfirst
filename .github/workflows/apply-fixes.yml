name: apply-fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 _apply_fixes.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'бот.py' 'база_данных/пользователи.py' 'база_данных/теплица.py' '_apply_fixes.py'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: promo rewards and greenhouse grow button"
          git push
