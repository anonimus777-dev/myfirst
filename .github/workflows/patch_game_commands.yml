name: Patch game commands

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch bot.py
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('бот.py')
          s = p.read_text(encoding='utf-8')

          marker = '# GAME_ALIASES_PATCHED_20260826'
          if marker in s:
              print('Patch already applied.')
              raise SystemExit(0)

          replacements = {
              '    if text.startswith("очко ") or text.startswith("21 "):\n':
              '    if text == "очко" or text == "21" or text.startswith("очко ") or text.startswith("21 "):\n',
              '    if text.startswith("боулинг"):\n':
              '    if text == "боулинг" or text == "бо" or text.startswith("боулинг ") or text.startswith("бо "):\n',
              '    if text.startswith("баскетбол"):\n':
              '    if text == "баскетбол" or text == "бс" or text.startswith("баскетбол ") or text.startswith("бс "):\n',
              '    if text.startswith("дартс"):\n':
              '    if text == "дартс" or text == "дс" or text.startswith("дартс ") or text.startswith("дс "):\n',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Не найден фрагмент: {old!r}')
              s = s.replace(old, new, 1)

          old = '''    if text == "баскетбол" or text == "бс" or text.startswith("баскетбол ") or text.startswith("бс "):\n        parts_g = raw.split()\n        if len(parts_g) < 2:\n            await update.message.reply_text(f"Пример: <code>Баскетбол [ставка]</code>", parse_mode=ParseMode.HTML)\n            return\n'''
          new = '''    if text == "баскетбол" or text == "бс" or text.startswith("баскетбол ") or text.startswith("бс "):\n        parts_g = raw.split()\n        if len(parts_g) < 2:\n            await update.message.reply_text(\n                f"🥶 {user_link(uid, user['username'])}, ты ввел что-то неправильно!\\n"\n                f"<code>·····················</code>\\n"\n                f"<u>♠️ 21/очко <b>[ставка]</b></u>",\n                parse_mode=ParseMode.HTML\n            )\n            return\n'''
          if old not in s:
              raise SystemExit('Не найден блок баскетбола.')
          s = s.replace(old, new, 1)

          s += '\n' + marker + '\n'
          p.write_text(s, encoding='utf-8')
          print('Команды игр исправлены.')
          PY

      - name: Validate Python
        run: python3 -m py_compile бот.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add бот.py
          if git diff --cached --quiet; then
            echo "Нечего коммитить."
            exit 0
          fi
          git commit -m "Fix game command aliases"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/patch_game_commands.yml
          git add .github/workflows/patch_game_commands.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary game command patch workflow"
          git push
