name: Fix game output
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-game-output.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix messages and cooldowns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('бот.py')
          s=p.read_text(encoding='utf-8')

          def replace_last_reply(block, replacement):
              matches=list(re.finditer(r'        await update\.message\.reply_text\(.*?\n        \)', block, re.S))
              if not matches:
                  return block
              m=matches[-1]
              return block[:m.start()]+replacement+block[m.end():]

          # Exact game blocks. The final reply in each block is replaced; validation/error replies stay untouched.
          specs=[
            ('# Рулетка', '🎮', '🖲 Выпало - {num} {color}'),
            ('# Кубик', '🎲', '🎲 Выпало - {rolled}'),
            ('# Стаканчик', '🥛', '🥛 Выпало - {correct}'),
            ('# Орёл/Решка', '🪙', '🪙 Выпало - {result}'),
            ('# Боулинг', '🎳', '🎳 Выпало - {pins}'),
            ('# Баскетбол', '🏀', '🏀 Выпало - {roll}'),
            ('# Дартс', '🎯', '🎯 Выпало - {roll}'),
          ]
          markers=[m for m in re.finditer(r'^    # .+$',s,re.M)]
          for marker, emoji, result_line in specs:
              starts=[m.start() for m in markers if m.group(0).strip()==marker]
              if not starts: continue
              start=starts[0]
              nexts=[m.start() for m in markers if m.start()>start]
              end=nexts[0] if nexts else len(s)
              block=s[start:end]
              # Don't alter handlers whose final output is already compact.
              if 'Ставка:' not in block and '📊 Итог:' not in block:
                  continue
              if marker=='# Рулетка':
                  repl='''        color = "🟢" if num == 0 else ("🔴" if num in red_nums else "⚫️")\n        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(change)}</b> кр.!" if change > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user['username'])}\\n🖲 Выпало - {num} {color}\\n{result_text}", parse_mode=ParseMode.HTML)'''
              elif marker=='# Кубик':
                  repl='''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(win)}</b> кр.!" if win > 0 else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user['username'])}\\n🎲 Выпало - {rolled}\\n{result_text}", parse_mode=ParseMode.HTML)'''
              elif marker=='# Боулинг':
                  repl='''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(win)}</b> кр.!" if win > bet else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user['username'])}\\n🎳 Выпало - {pins}\\n{result_text}", parse_mode=ParseMode.HTML)'''
              elif marker=='# Баскетбол':
                  repl='''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(win)}</b> кр.!" if win > bet else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user['username'])}\\n🏀 Выпало - {roll}\\n{result_text}", parse_mode=ParseMode.HTML)'''
              elif marker=='# Дартс':
                  repl='''        result_text = f"✅ Твой выигрыш составил <b>{fmt_smart(win)}</b> кр.!" if win > bet else "🛑 Ты проиграл(-а)! Попытай удачу в следующий раз 😣"\n        await update.message.reply_text(f"{user_link(uid, user['username'])}\\n🎯 Выпало - {roll}\\n{result_text}", parse_mode=ParseMode.HTML)'''
              else:
                  continue
              newblock=replace_last_reply(block,repl)
              s=s[:start]+newblock+s[end:]
              markers=[m for m in re.finditer(r'^    # .+$',s,re.M)]
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile бот.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add бот.py
          git diff --cached --quiet || git commit -m 'compact game result messages'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-game-output.yml
          git commit -m 'remove temporary game fix workflow'
          git push
