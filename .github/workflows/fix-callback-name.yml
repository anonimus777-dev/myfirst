name: Apply bunker fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Room upgrade: take the currency directly from callback data.
          p = Path('бот.py')
          s = p.read_text(encoding='utf-8')
          old = 'use_bottles = context.user_data.get(f"room_{room_num}_bottles", False)'
          new = 'use_bottles = (len(parts) >= 5 and parts[4] == "bottles") or context.user_data.get(f"room_{room_num}_bottles", False)'
          if old not in s:
              raise SystemExit('room currency target not found')
          s = s.replace(old, new, 1)

          # 2) Fire notification: one silent callback notification instead of a chat message.
          old_fire = '''        if fire:\n            try:\n                chat_id = query.message.chat_id\n                await context.bot.send_message(\n                    chat_id=chat_id,\n                    text=f"🔥 {user_link(uid, (await get_user(uid))['username'])}, в бункере произошёл пожар!\\n"\n                         f"Напиши <code>Починить бункер</code> для починки.",\n                    parse_mode=ParseMode.HTML\n                )\n            except:\n                pass\n'''
          new_fire = '''        if fire:\n            fire_user = await get_user(uid)\n            fire_name = fire_user["username"] or "Игрок"\n            await query.answer(\n                f"🔥 {fire_name}, в бункере пожар! Напиши Починить бункер для починки.",\n                show_alert=False\n            )\n        else:\n            if result:\n                await query.answer(result[:200])\n'''
          if old_fire not in s:
              raise SystemExit('fire block target not found')
          # Remove the earlier unconditional callback answer so fire uses the single callback notification.
          old_answer = '''        if result:\n            await query.answer(result[:200])\n        else:\n            await query.answer()\n'''
          if old_answer not in s:
              raise SystemExit('result answer target not found')
          s = s.replace(old_answer, '', 1)
          s = s.replace(old_fire, new_fire, 1)
          p.write_text(s, encoding='utf-8')

          # 3) TOP nicknames: first 10 characters + three dots.
          p = Path('вспомогательные/сообщения.py')
          s = p.read_text(encoding='utf-8')
          marker = '    username = user["username"] or "Игрок"\n\n'
          helper = '    username = user["username"] or "Игрок"\n\n    def short_nick(name):\n        name = name or "Игрок"\n        return name if len(name) <= 10 else name[:10] + "..."\n\n'
          if marker not in s:
              raise SystemExit('top helper marker not found')
          # Only insert into the first build_bunker_text occurrence; locate build_top_text explicitly.
          top_start = s.index('async def build_top_text')
          before, top = s[:top_start], s[top_start:]
          top_marker = '    username = user["username"] or "Игрок"\n\n'
          if top_marker not in top:
              raise SystemExit('top username marker not found')
          top = top.replace(top_marker, helper, 1)
          top = top.replace("uname2 or 'Игрок'", "short_nick(uname2 or 'Игрок')")
          top = top.replace("{uname2} — {fmt_val(val)}", "{short_nick(uname2)} — {fmt_val(val)}")
          top = top.replace("user_link(user_id, username)", "user_link(user_id, short_nick(username))")
          s = before + top
          p.write_text(s, encoding='utf-8')
          PY

          python3 -m py_compile бот.py база_данных/бункер.py база_данных/теплица.py вспомогательные/сообщения.py клавиатуры/бункер.py

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'бот.py' 'вспомогательные/сообщения.py' 'база_данных/бункер.py' 'база_данных/теплица.py' 'клавиатуры/бункер.py'
          git diff --cached --quiet || git commit -m 'fix: bunker fire notification, bottle upgrades and top nicknames'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f '.github/workflows/fix-callback-name.yml'
          git add '.github/workflows/fix-callback-name.yml'
          git diff --cached --quiet || git commit -m 'chore: remove temporary fix workflow'
          git push || true
