name: fix-syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Protect every promo reward from SQLite INTEGER overflow.
          p = Path('база_данных/пользователи.py')
          s = p.read_text(encoding='utf-8')
          marker = '        uses_left = int(promo_data.get("uses_left", 1))\n'
          insert = '''        uses_left = int(promo_data.get("uses_left", 1))\n        SQLITE_MAX = 9223372036854775807\n        if amount < 0 or amount > SQLITE_MAX:\n            await update.message.reply_text("❌ Слишком большое количество награды.")\n            return\n'''
          if marker in s and 'SQLITE_MAX = 9223372036854775807' not in s:
              s = s.replace(marker, insert, 1)

          # Also check the current DB value before adding the reward.
          marker2 = '            if reward_type == "coins":\n'
          insert2 = '''            reward_columns = {\n                "coins": "balance",\n                "bottles": "bottles",\n                "rating": "rating",\n                "bbcoins": "bb_coins",\n                "exp": "exp",\n            }\n            reward_column = reward_columns.get(reward_type)\n            if reward_column:\n                table = "greenhouse" if reward_type == "exp" else "users"\n                async with db.execute(f"SELECT COALESCE({reward_column}, 0) FROM {table} WHERE user_id=?", (uid,)) as cur:\n                    row = await cur.fetchone()\n                current_value = int(row[0] or 0) if row else 0\n                if current_value > SQLITE_MAX - amount:\n                    await update.message.reply_text("❌ Награда слишком большая для текущего баланса.")\n                    return\n\n            if reward_type == "coins":\n'''
          if marker2 in s and 'reward_columns = {' not in s:
              s = s.replace(marker2, insert2, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Inline greenhouse grow: use a callback toast instead of sending a new chat message.
          p = Path('база_данных/теплица.py')
          s = p.read_text(encoding='utf-8')
          old_water = '''    if water < qty:\n        await update.effective_message.reply_text(\n            f"{user_link(uid, username)}, у тебя недостаточно воды!\\n"\n            f"Есть: {water}/{water_limit} 💧",\n            parse_mode=ParseMode.HTML\n        )\n        return\n'''
          new_water = '''    if water < qty:\n        message = f"{user_link(uid, username)}, у тебя недостаточно воды!"\n        if update.callback_query:\n            await update.callback_query.answer(message, show_alert=False)\n        else:\n            await update.effective_message.reply_text(message, parse_mode=ParseMode.HTML)\n        return\n'''
          if old_water not in s:
              raise SystemExit('greenhouse water block not found')
          s = s.replace(old_water, new_water, 1)

          old_success = '''    await update.effective_message.reply_text(\n        f"🙎‍♂️ {user_link(uid, username)}, ты успешно вырастил(-а) {CROP_FORMS_ACC.get(crop_name, crop_name)}!\\n"\n        f"Получено: {total_crop} {crop_data['emoji']}, {total_exp} опыта\\n"\n        f"Потрачено: {qty} 💧\\n"\n        f"Осталось воды: {water_left}/{water_limit} 💧",\n        parse_mode=ParseMode.HTML\n    )\n'''
          new_success = '''    message = (\n        f"{user_link(uid, username)}, успешно выращено: {total_crop} {crop_data['emoji']}, "\n        f"+{total_exp} опыта, -{qty} 💧"\n    )\n    if update.callback_query:\n        await update.callback_query.answer(message, show_alert=False)\n    else:\n        await update.effective_message.reply_text(\n            f"🙎‍♂️ {user_link(uid, username)}, ты успешно вырастил(-а) {CROP_FORMS_ACC.get(crop_name, crop_name)}!\\n"\n            f"Получено: {total_crop} {crop_data['emoji']}, {total_exp} опыта\\n"\n            f"Потрачено: {qty} 💧\\n"\n            f"Осталось воды: {water_left}/{water_limit} 💧",\n            parse_mode=ParseMode.HTML\n        )\n'''
          if old_success not in s:
              raise SystemExit('greenhouse success block not found')
          s = s.replace(old_success, new_success, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python3 -m py_compile 'бот.py' 'база_данных/пользователи.py' 'база_данных/теплица.py'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'база_данных/пользователи.py' 'база_данных/теплица.py'
          git commit -m 'fix: protect promo rewards and greenhouse callback' || true
          git push origin main

          # Remove this temporary workflow after the fixes are committed.
          git rm '.github/workflows/fix-syntax.yml' || true
          git commit -m 'chore: remove temporary fix workflow' || true
          git push origin main || true
