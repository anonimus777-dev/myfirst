name: add-callback-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _add_callback_fix.py
      - run: python3 -m py_compile bot.py 2>/dev/null || python3 -m py_compile 'бот.py'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'бот.py' '_add_callback_fix.py'
          git commit -m "fix: add admin promo type callback"
          git push
