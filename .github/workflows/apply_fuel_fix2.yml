name: Apply fuel behavior fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: fuel behavior' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bot.py
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('бот.py')
          s = p.read_text(encoding='utf-8')
          start_marker = '    elif data.startswith("fuel_full_") or data.startswith("fuel_hour_"):'
          end_marker = '    elif data.startswith("room_currency_"):'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('fuel block markers not found')
          new_block = '''    elif data.startswith("fuel_full_") or data.startswith("fuel_hour_"):
          uid2 = int(data.split("_")[2])
          if uid2 != uid:
              await query.answer("Это не твой бункер!", show_alert=True)
              return

          user2 = await get_user(uid)
          total_income = await get_total_income(uid)
          fuel_per_hour = max(1, total_income // 5)
          max_fuel = fuel_per_hour * 12
          current_fuel = int(user2.get("fuel", 0))

          if data.startswith("fuel_full_"):
              need = max(0, max_fuel - current_fuel)
          else:
              need = max(0, min(fuel_per_hour, max_fuel - current_fuel))

          if need <= 0:
              await query.answer("У вас почти полный запас бензина!")
              return

          if user2["balance"] < need:
              await query.answer("У вас недостаточно крышек!")
              return

          async with aiosqlite.connect(DB_PATH) as db:
              await db.execute(
                  "UPDATE users SET balance = balance - ?, fuel = fuel + ? WHERE user_id=?",
                  (need, need, uid)
              )
              await db.commit()

          new_fuel = current_fuel + need
          text = (
              f"{user_link(uid, user2['username'])}\\n"
              f"🛢 Нефтехранилище\\n\\n"
              f"⛽️ Твой текущий запас бензина: {fmt_smart(new_fuel)}/{fmt_smart(max_fuel)} л.\\n"
              f"🪫 Расход: {fmt_smart(fuel_per_hour)} л./час\\n"
              f"💵 Цена за литр: 1 крышка"
          )

          if data.startswith("fuel_full_"):
              await query.answer("Ты успешно пополнил бензин до полного бака!")
          else:
              await query.answer("Бензин успешно куплен!")

          await query.message.edit_text(text, parse_mode=ParseMode.HTML)

'''
          p.write_text(s[:start] + new_block + s[end:], encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python3 -m py_compile бот.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add бот.py
          git rm .github/workflows/apply_fuel_fix2.yml
          git diff --cached --quiet || git commit -m 'fix: fuel behavior'
          git push