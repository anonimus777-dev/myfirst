name: finish-promo-flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _finish_promo_flow.py
      - run: python3 -m py_compile 'бот.py'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'бот.py' '_finish_promo_flow.py'
          git commit -m "fix: complete interactive promo creation"
          git push
