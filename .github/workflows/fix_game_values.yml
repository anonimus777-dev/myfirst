name: Fix native game result mappings

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('бот.py')
          s = p.read_text(encoding='utf-8')

          old = '''        if pins == 10:\n            mult, win = 3, bet * 3\n            desc = f"🎳 СТРАЙК! Все 10 кеглей! x3"\n        elif pins >= 7:\n            mult, win = 1.5, int(bet * 1.5)\n            desc = f"🎳 Отлично! {pins}/10 кеглей. x1.5"\n        elif pins >= 4:\n            mult, win = 1, bet\n            desc = f"😐 {pins}/10 кеглей. x1 (возврат)"\n        else:\n            mult, win = 0, 0\n            desc = f"❌ Промах. {pins}/10 кеглей. x0"'''
          new = '''        if pins == 6:\n            win, desc = bet * 3, "🎳 СТРАЙК! x3"\n        elif pins == 5:\n            win, desc = int(bet * 1.5), "🎳 Отличный бросок! x1.5"\n        elif pins in (3, 4):\n            win, desc = bet, f"😐 {pins}/6. x1 (возврат)"\n        else:\n            win, desc = 0, f"❌ {pins}/6. x0"'''
          if old not in s: raise SystemExit('bowling mapping not found')
          s = s.replace(old, new, 1)

          old = '''        if roll >= 8:\n            win, desc = bet * 2, f"🏀 Попал в кольцо! x2"\n        elif roll >= 5:\n            win, desc = int(bet * 1.2), f"🏀 Рикошет и попал! x1.2"\n        else:\n            win, desc = 0, f"❌ Промах мимо кольца! x0"'''
          new = '''        if roll == 5:\n            win, desc = bet * 2, "🏀 Попал в кольцо! x2"\n        elif roll in (3, 4):\n            win, desc = int(bet * 1.2), "🏀 Рикошет и попал! x1.2"\n        else:\n            win, desc = 0, "❌ Промах мимо кольца! x0"'''
          if old not in s: raise SystemExit('basketball mapping not found')
          s = s.replace(old, new, 1)

          old = '''        if roll <= 5:\n            win, mult, desc = bet * 10, "x10", "меткость твоё второе имя! БУЛЛСАЙ! 🎯"\n        elif roll <= 20:\n            win, mult, desc = bet * 5, "x5", "отличный бросок! 🎯"\n        elif roll <= 45:\n            win, mult, desc = bet * 2, "x2", "попал! x2 🎯"\n        elif roll <= 65:\n            win, mult, desc = bet, "x1", "попал рядом с центром. x1 🤨"\n        else:\n            win, mult, desc = 0, "x0", "промахнулся! x0 😱"'''
          new = '''        if roll == 6:\n            win, mult, desc = bet * 10, "x10", "меткость твоё второе имя! БУЛЛСАЙ! 🎯"\n        elif roll == 5:\n            win, mult, desc = bet * 5, "x5", "отличный бросок! 🎯"\n        elif roll == 4:\n            win, mult, desc = bet * 2, "x2", "попал! x2 🎯"\n        elif roll == 3:\n            win, mult, desc = bet, "x1", "попал рядом с центром. x1 🤨"\n        else:\n            win, mult, desc = 0, "x0", "промахнулся! x0 😱"'''
          if old not in s: raise SystemExit('darts mapping not found')
          s = s.replace(old, new, 1)

          s = s.replace('result_line = f"🎉 Выигрыш: {fmt_smart(win)} GPoint"', 'result_line = f"🎉 Выигрыш: {fmt_smart(win)} кр."', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile бот.py
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add бот.py
          git commit -m 'Fix native game result mappings'
          git push
          git rm .github/workflows/fix_game_values.yml
          git commit -m 'Remove temporary game mapping workflow'
          git push
